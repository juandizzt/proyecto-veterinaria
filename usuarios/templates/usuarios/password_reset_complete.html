{% extends 'base.html' %}
{% block navbar %}{% endblock %}
{% block content %}

<style>
  @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Nunito:wght@400;600;700&display=swap');

  :root {
    --verde: #4a9e5c;
    --verde-dark: #357a45;
    --verde-light: #e8f5eb;
    --texto: #1a2e1f;
    --gris: #6b7c6e;
  }

  body {
    background: linear-gradient(135deg, #f0f7f1 0%, #e8f5eb 50%, #f5faf6 100%);
    min-height: 100vh;
    font-family: 'Nunito', sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 2rem;
  }

  .auth-card {
    background: white;
    border-radius: 24px;
    box-shadow: 0 20px 60px rgba(74, 158, 92, 0.15);
    padding: 3rem 2.5rem;
    width: 100%;
    max-width: 420px;
    text-align: center;
    position: relative;
    animation: slideUp 0.5s ease;
  }

  .auth-card::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 5px;
    background: linear-gradient(90deg, var(--verde), var(--verde-dark));
    border-radius: 24px 24px 0 0;
  }

  @keyframes slideUp {
    from { opacity: 0; transform: translateY(24px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  .success-circle {
    width: 88px; height: 88px;
    background: var(--verde-light);
    border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    margin: 0 auto 1.5rem;
    animation: popIn 0.5s 0.3s cubic-bezier(0.34, 1.56, 0.64, 1) both;
  }

  @keyframes popIn {
    from { opacity: 0; transform: scale(0.5); }
    to   { opacity: 1; transform: scale(1); }
  }

  .success-circle svg {
    width: 44px; height: 44px;
    stroke: var(--verde);
    stroke-width: 2.5;
  }

  .auth-title {
    font-family: 'Playfair Display', serif;
    color: var(--verde-dark);
    font-size: 1.9rem;
    margin-bottom: 0.8rem;
  }

  .auth-msg {
    color: var(--gris);
    font-size: 0.95rem;
    line-height: 1.6;
    margin-bottom: 2rem;
  }

  .btn-primary {
    display: inline-block;
    width: 100%;
    padding: 0.9rem;
    background: linear-gradient(135deg, var(--verde), var(--verde-dark));
    color: white;
    border: none;
    border-radius: 14px;
    font-size: 1rem;
    font-weight: 700;
    font-family: 'Nunito', sans-serif;
    cursor: pointer;
    text-decoration: none;
    transition: transform 0.15s, box-shadow 0.15s;
    box-sizing: border-box;
  }

  .btn-primary:hover {
    transform: translateY(-2px);
    box-shadow: 0 8px 24px rgba(74, 158, 92, 0.35);
    color: white;
  }
</style>

<div class="auth-card">
  <div class="success-circle">
    <svg fill="none" viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round">
      <path d="M20 6L9 17l-5-5"/>
    </svg>
  </div>

  <h1 class="auth-title">¡Listo!</h1>
  <p class="auth-msg">
    Tu contraseña ha sido cambiada exitosamente.<br>
    Ya puedes iniciar sesión con tu nueva contraseña.
  </p>

  <a href="{% url 'login' %}" class="btn-primary">Iniciar sesión</a>
</div>

{% endblock %}
