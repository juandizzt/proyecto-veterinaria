<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>{% block title %}Sistema de Citas - Veterinaria{% endblock %}</title>
    <style>
        /* Estilos Base y Reset */
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
            background: #f8faf9;
            color: #333;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            padding-top: 90px;
        }

        /* Header La Pradera */
        header {
            background: linear-gradient(135deg, #4caf50, #66bb6a);
            color: white;
            position: fixed;
            top: 0;
            width: 100%;
            z-index: 1000;
            box-shadow: 0 2px 15px rgba(0,0,0,0.1);
        }

        .nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0.8rem 2rem;
            max-width: 1200px;
            margin: 0 auto;
        }

        .logo { display: flex; align-items: center; gap: 1rem; }
        .logo-img {
            width: 140px; height: 55px; border-radius: 8px;
            background: white; border: 2px solid white; overflow: hidden;
        }
        .logo-img img { width: 100%; height: 100%; object-fit: contain; }
        .logo h1 { font-size: 1.8rem; color: white !important; margin: 0; }

        .nav-links a {
            color: white; text-decoration: none; font-weight: 500;
            padding: 0.6rem 1.2rem; border-radius: 8px; transition: 0.3s;
        }
        .nav-links a:hover { background: rgba(255,255,255,0.2); }

        /* Contenedor Principal */
        .main-content { flex: 1; padding: 30px 0; }
        .container { max-width: 1100px; margin: 0 auto; padding: 0 20px; }

        /* --- ESTILOS DE TABLAS Y CARDS (Para Mis Citas) --- */
        .card-global {
            background: white;
            padding: 25px;
            border-radius: 15px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.05);
            border-top: 5px solid #4caf50;
        }

        .table-responsive { overflow-x: auto; margin-top: 20px; }
        
        table {
            width: 100%;
            border-collapse: collapse;
            margin-bottom: 1rem;
        }

        th {
            background-color: #f1f8e9;
            color: #2e7d32;
            padding: 12px;
            text-align: left;
            font-weight: 700;
            border-bottom: 2px solid #e8f5e9;
        }

        td {
            padding: 15px 12px;
            border-bottom: 1px solid #eee;
            vertical-align: middle;
        }

        tr:hover { background-color: #fafafa; }

        /* Badge de estado */
        .status-badge {
            padding: 5px 12px;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: 600;
            background: #e8f5e9;
            color: #2e7d32;
        }

        /* Botón de acción rápido */
        .btn-small {
            padding: 6px 12px;
            border-radius: 6px;
            text-decoration: none;
            font-size: 0.85rem;
            background: #4caf50;
            color: white;
            transition: 0.3s;
        }

        .btn-small:hover { background: #388e3c; }

        /* Footer */
        footer {
            background: #4caf50; color: white; padding: 1.2rem 0;
            text-align: center; font-size: 0.9rem; margin-top: auto;
        }

    /* Contenedor principal (la barra verde) */
.nav-user-container {
    background-color: #63b965; /* El verde exacto de la imagen */
    padding: 15px 20px;
    display: flex;
    align-items: center;
}

.nav-user-content {
    display: flex;
    align-items: center;
    gap: 25px; /* Espacio entre el texto y el botón */
    font-family: Arial, sans-serif;
}

/* Texto de "Bienvenido" */
.welcome-text {
    color: white;
    font-size: 18px;
    display: flex;
    align-items: center;
}

/* El nombre del usuario (enlace) */
.user-name {
    color: white;
    text-decoration: none; /* Quita el subrayado */
    font-weight: normal;
    margin-left: 20px;
}

/* Botón de Cerrar Sesión */
.btn-logout {
    background-color: rgba(255, 255, 255, 0.2); /* Fondo blanco semitransparente */
    color: white;
    text-decoration: none;
    padding: 10px 20px;
    border-radius: 8px; /* Bordes redondeados */
    font-size: 16px;
    transition: background 0.3s ease;
}

.btn-logout:hover {
    background-color: rgba(255, 255, 255, 0.3); /* Se aclara un poco al pasar el mouse */
}
    </style>
</head>
<body>
    <header>
        <nav class="nav">
            <div class="logo">
                <div class="logo-img">
                    {% load static %}
                    <img src="{% static 'imagenes/praderas.jpg' %}" alt="Logo">
                </div>
                <h1>La Pradera</h1>
            </div>
            <div class="nav-links">
                <a href="{% url 'inicio' %}">Inicio</a>
                <a href="{% url 'nosotros'%}">Nosotros</a>
                <a href="{% url 'lista' %}">Productos</a>
                <a href="{% url 'citas:lista_citas' %}" style="background: rgba(255,255,255,0.3)">Mis Citas</a>
            </div>
<div class="nav-user-container">
  {% if user.is_authenticated %}
    <div class="nav-user-content">
      <span class="welcome-text">
        Bienvenido <a href="{% url 'dashboard' %}" class="user-name">{{ user.username }}</a>
      </span>
      <a href="{% url 'logout' %}" class="btn-logout">
        Cerrar Sesión
      </a>
    </div>
  {% endif %}
</div>
        </nav>
    </header>

    <main class="main-content">
        <div class="container">
            {% block content %}{% endblock %}
        </div>
    </main>

<footer>
  <div class="footer-content" style="display: flex; justify-content: space-around; flex-wrap: wrap; gap: 20px; max-width: 1100px; margin: 0 auto; padding: 0 20px;">
    <div class="footer-item">🏠︎ <strong>Ubicación:</strong> Carrea 144 Barrio El Salado</div>
    <div class="footer-item">☏ <strong>Teléfono:</strong> 3212345673</div>
    <div class="footer-item">✉ <strong>Correo:</strong> lapradera@gmail.com</div>
  </div>
</footer>
    
</body>
</html>
